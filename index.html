<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
    text-align: center;
}

header {
    padding: 30px;
    font-size: 30px;
    font-weight: bold;
}

.hero {
    padding: 80px 20px;
}

h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

p {
    font-size: 22px;
    color: #aaa;
}

button {
    margin-top: 30px;
    padding: 15px 35px;
    border-radius: 30px;
    border: none;
    background: white;
    color: black;
    font-size: 18px;
    cursor: pointer;
}

.card {
    margin: 40px auto;
    max-width: 700px;
    padding: 30px;
    background: #111;
    border-radius: 25px;
}
</style>

</head>

<body>

<header>
Mi Proyecto
</header>

<section class="hero">

<h1>Innovación y Diseño</h1>

<p>
Una página creada con un estilo moderno,
simple y elegante.
</p>

<button>
Comenzar
</button>

</section>

<div class="card">
<h2>Sobre nosotros</h2>
<p>
Aquí puedes poner información,
productos o tus ideas.
</p>
</div>

</body>
</html>
