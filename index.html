<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel</title>

<style>

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

.hora {
  font-size: 60px;
  font-weight: bold;
  margin-top: 25px;
}

.fecha {
  font-size: 25px;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

button {
  height: 100px;
  border-radius: 15px;
  border: none;
  background: #222;
  color: white;
  font-size: 22px;
  transition: 0.3s;
}

.encendido {
  background: blue;
}

</style>

</head>

<body>

<div class="hora" id="hora"></div>
<div class="fecha" id="fecha"></div>


<div class="grid">

<button onclick="cambiar(this)">🐟 Pecera</button>
<button onclick="cambiar(this)">🛋️ Velador</button>

<button onclick="cambiar(this)">🛏️ Cama</button>
<button onclick="cambiar(this)">💡 Luz</button>

<button onclick="cambiar(this)">🌈 LED</button>
<button onclick="cambiar(this)">📻 Radio</button>

<button onclick="cambiar(this)">📺 Tele</button>
<button onclick="cambiar(this)">🎵 Música</button>

</div>


<script>

function actualizarHora(){

let ahora = new Date();

document.getElementById("hora").innerHTML =
ahora.toLocaleTimeString([], {
hour:'2-digit',
minute:'2-digit'
});

document.getElementById("fecha").innerHTML =
ahora.toLocaleDateString();

}

setInterval(actualizarHora,1000);
actualizarHora();


function cambiar(boton){

boton.classList.toggle("encendido");

}

</script>


</body>
</html>
