<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Home</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

.info {
  font-size: 22px;
  margin: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

button {
  height: 90px;
  border-radius: 20px;
  border: none;
  background: #222;
  color: white;
  font-size: 20px;
}

button:active {
  background: #444;
}
</style>
</head>

<body>

<h1>🏠 Smart Home</h1>

<div class="info" id="hora"></div>
<div class="info">☀️ Clima: Cargando...</div>

<div class="grid">

<button>🐟 Pecera</button>
<button>🛋️ Velador</button>
<button>🛏️ Cama</button>
<button>💡 Luz</button>
<button>🌈 LED</button>
<button>📻 Radio</button>
<button>📺 Tele</button>
<button>🎵 Música</button>

</div>

<script>
function actualizarHora(){
 let ahora = new Date();
 document.getElementById("hora").innerHTML =
 ahora.toLocaleDateString() + "<br>" +
 ahora.toLocaleTimeString();
}

setInterval(actualizarHora,1000);
actualizarHora();
</script>

</body>
</html>
