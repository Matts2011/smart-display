<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPad Home</title>

<style>

body {
    margin:0;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
}

.container {
    padding:30px;
}

.top {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.time {
    font-size:60px;
    font-weight:bold;
}

.date {
    color:#aaa;
    font-size:22px;
}

.card {
    background:#151515;
    border-radius:25px;
    padding:25px;
    margin-top:25px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.button {
    background:#222;
    border-radius:25px;
    padding:30px;
    text-align:center;
    font-size:22px;
}

.icon {
    font-size:45px;
}

</style>

</head>

<body>

<div class="container">

<div class="top">

<div>
<div class="time">12:00</div>
<div class="date">Miércoles 29 de julio</div>
</div>

<div class="icon">
🏠
</div>

</div>


<div class="card">

<h2>Mi Casa</h2>

<div class="grid">

<div class="button">
<div class="icon">💡</div>
Luces
</div>


<div class="button">
<div class="icon">🎵</div>
Música
</div>


<div class="button">
<div class="icon">🌡️</div>
Clima
</div>


<div class="button">
<div class="icon">⚙️</div>
Dispositivos
</div>


</div>

</div>


</div>
<script>

function actualizarReloj(){

let ahora = new Date();

let hora = ahora.getHours().toString().padStart(2,'0');
let minutos = ahora.getMinutes().toString().padStart(2,'0');

document.querySelector(".time").innerHTML =
hora + ":" + minutos;

}

setInterval(actualizarReloj,1000);

actualizarReloj();



let botones = document.querySelectorAll(".button");

botones.forEach(boton=>{

boton.onclick=function(){

boton.style.background =
boton.style.background=="#0071e3"
? "#222"
: "#0071e3";

}

});

</script>
</body>
</html>
