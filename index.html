<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel</title>

<style>

body {
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.hora {
  font-size:60px;
  font-weight:bold;
  margin-top:25px;
}

.fecha {
  font-size:24px;
  margin-bottom:30px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  padding:20px;
}

button {
  height:100px;
  border-radius:15px;
  border:none;
  background:#222;
  color:white;
  font-size:22px;
}

.encendido {
  background:#0066ff;
}

</style>
</head>

<body>

<div class="hora" id="hora"></div>
<div class="fecha" id="fecha"></div>


<div class="grid">

<button onclick="accion(this,'Smart Life - Pecera')">🐟 Pecera</button>

<button onclick="accion(this,'Smart Life - Velador')">🛋️ Velador</button>

<button onclick="accion(this,'CozyLife - Cama')">🛏️ Cama</button>

<button onclick="accion(this,'Smart Life - Luz')">💡 Luz</button>

<button onclick="accion(this,'BroadLink - LED')">🌈 LED</button>

<button onclick="accion(this,'BroadLink - Radio')">📻 Radio</button>

<button onclick="accion(this,'BroadLink - TV')">📺 Tele</button>

<button onclick="spotify()">🎵 Música</button>

</div>


<script>

function actualizar(){

let ahora=new Date();

document.getElementById("hora").innerHTML =
ahora.toLocaleTimeString([],{
hour:'2-digit',
minute:'2-digit'
});

document.getElementById("fecha").innerHTML =
ahora.toLocaleDateString();

}

setInterval(actualizar,1000);
actualizar();



function accion(boton,dispositivo){

boton.classList.toggle("encendido");

console.log("Control:",dispositivo);

}



function spotify(){

window.open("https://open.spotify.com");

}

</script>


</body>
</html>
