<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPad Home</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    padding:30px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.time{
    font-size:70px;
    font-weight:bold;
}

.date{
    color:#aaa;
    font-size:22px;
}

.card{
    background:#151515;
    border-radius:30px;
    padding:25px;
    margin-top:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.button{
    background:#222;
    border-radius:25px;
    padding:35px;
    text-align:center;
    font-size:24px;
    transition:0.3s;
}

.button:active{
    transform:scale(0.95);
}

.icon{
    font-size:50px;
}

.active{
    background:#0071e3;
}

</style>

</head>

<body>

<div class="container">

<div class="top">

<div>
<div class="time">00:00</div>
<div class="date">Mi casa inteligente</div>
</div>

<div class="icon">
🏠
</div>

</div>


<div class="card">

<h2>Control del hogar</h2>

<div class="grid">

<div class="button">
<div class="icon">💡</div>
Luces
</div>

<div class="button">
<div class="icon">🎵</div>
Música
</div>

<div class="button">
<div class="icon">🌡️</div>
Clima
</div>

<div class="button">
<div class="icon">⚙️</div>
Dispositivos
</div>

</div>

</div>

</div>


<script>

function reloj(){

let fecha = new Date();

let h = fecha.getHours().toString().padStart(2,"0");
let m = fecha.getMinutes().toString().padStart(2,"0");

document.querySelector(".time").innerHTML = h + ":" + m;

}

setInterval(reloj,1000);
reloj();


let botones=document.querySelectorAll(".button");

botones.forEach(boton=>{

boton.onclick=function(){

boton.classList.toggle("active");

}

});

</script>


</body>
</html>
